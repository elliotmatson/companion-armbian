name: Build Select Boards on Companion Update via Renovate

# Triggered when Renovate bumps companion-version.txt to a new Companion release.
# Builds Armbian images for a selected set of boards with that Companion version included, then generates a release with the new images attached.
# Runs on push to main (rather than on PR merge) so that branch-automerged updates, which have no PR, also produce a release.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - companion-version.txt
  workflow_dispatch:

jobs:
  get-companion-version:
    runs-on: ubuntu-latest
    outputs:
      companion_version: ${{ steps.get-version.outputs.companion_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Get Companion Version from companion-version.txt, including leading 'v'
        id: get-version
        run: |
          version="$(tr -d '[:space:]' < companion-version.txt)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Companion version in companion-version.txt: '$version'"
            exit 1
          fi
          echo "companion_version=$version" >> $GITHUB_OUTPUT

  build-matrix:
    needs: get-companion-version
    strategy:
      fail-fast: false
      matrix:
        # arm64 boards only: packer's arm-image builder and the Companion installer don't support 32-bit (armhf)
        armbian-board:
          - orangepizero2
          - orangepizero2w
          - orangepizero3
    uses: ./.github/workflows/armbian-builder.yaml
    secrets: inherit
    with:
      armbian-board: ${{ matrix.armbian-board }}
      companion-build: ${{ needs.get-companion-version.outputs.companion_version }}

  build-release:
    needs:
      - get-companion-version
      - build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMPANION_VERSION: ${{ needs.get-companion-version.outputs.companion_version }}
      ARMBIAN_REF: ${{ needs.build-matrix.outputs.armbian-ref }}
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "armbian-*"
          merge-multiple: true
          path: ./artifacts

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Armbian (Ubuntu Noble, minimal) images with [Companion $COMPANION_VERSION](https://github.com/bitfocus/companion/releases/tag/$COMPANION_VERSION) preinstalled, built from [armbian/build $ARMBIAN_REF](https://github.com/armbian/build/releases/tag/$ARMBIAN_REF)."
            echo
            echo "Flash the \`.img.xz\` for your board with balenaEtcher or Raspberry Pi Imager. Companion's web UI is on port 8000."
            echo
            echo "SSH is enabled. Log in as \`root\` with password \`1234\`; you'll be required to set a new password on first login."
            echo
            echo "## Companion $COMPANION_VERSION release notes"
            echo
            gh release view "$COMPANION_VERSION" --repo bitfocus/companion --json body --jq .body \
              || echo "See https://github.com/bitfocus/companion/releases/tag/$COMPANION_VERSION"
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          tag: "companion-update-${{ env.COMPANION_VERSION }}"
          commit: ${{ github.sha }}
          name: "Companion Update ${{ env.COMPANION_VERSION }}"
          artifacts: ./artifacts/*
          bodyFile: release-notes.md
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
